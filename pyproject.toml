[project]
name = "ola-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bindukasetty", email = "95398011+Bindukasetty@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.0",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pygraphviz>=2.0.1",
    "pyppeteer>=0.0.25",
]

[project.scripts]
ola-ai-project = "ola_ai_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
